; PlatformIO Project Configuration File
; Project: Literan Solar ESP32-S3 + Flow Sensor AICHI OF05ZAT
; Board: ESP32-S3 N8R16 (8MB Flash, 16MB OPI PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = COM5
monitor_port = COM5

; Konfigurasi Flash & PSRAM untuk ESP32-S3 N8R16 (8MB Flash, 16MB OPI PSRAM)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Dependensi library (menggunakan library bawaan core ESP32 yang stabil & ringan)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

